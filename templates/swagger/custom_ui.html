<!DOCTYPE html>
<html>
  <head>
    <title>{{ title|default:"Compass NewsAPI" }} — Docs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Base ─────────────────────────────────────────────────── */
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *::after, *::before { box-sizing: inherit; }

      body {
        margin: 0;
        background: #f0f4f8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* ── Top bar ────────────────────────────────────────────────── */
      .swagger-ui .topbar {
        background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
        border-bottom: 3px solid #ef4444;
        padding: 0;
      }

      .swagger-ui .topbar .wrapper {
        padding: 14px 24px;
        display: flex;
        align-items: center;
      }

      /* hide default logo/link text and schema input */
      .swagger-ui .topbar-wrapper img,
      .swagger-ui .topbar-wrapper .link span,
      .swagger-ui .topbar .download-url-wrapper { display: none; }

      .swagger-ui .topbar-wrapper::before {
        content: '🧭  Compass NewsAPI';
        font-size: 20px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.3px;
      }

      .swagger-ui .topbar-wrapper::after {
        content: 'v1.0.0';
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        margin-left: 10px;
        padding: 2px 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        letter-spacing: 0.5px;
      }

      /* ── Info section ──────────────────────────────────────────── */
      .swagger-ui .info { margin: 32px 0 20px; }

      .swagger-ui .info .title {
        font-size: 32px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.8px;
      }

      .swagger-ui .info .title small pre {
        background: #ef4444;
        color: #fff;
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 12px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        vertical-align: middle;
      }

      .swagger-ui .info p,
      .swagger-ui .info li {
        color: #475569;
        font-size: 14px;
        line-height: 1.75;
      }

      .swagger-ui .info code {
        background: #e2e8f0;
        color: #1e293b;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 13px;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }

      /* ── Authorize button ──────────────────────────────────────── */
      .swagger-ui .btn.authorize {
        background: #ef4444;
        border-color: #ef4444;
        color: #fff;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 13px;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      }

      .swagger-ui .btn.authorize:hover {
        background: #dc2626;
        border-color: #dc2626;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(239,68,68,0.4);
      }

      .swagger-ui .btn.authorize svg { fill: #fff; }

      /* ── Scheme / server container ─────────────────────────────── */
      .swagger-ui .scheme-container {
        background: #fff;
        border-radius: 10px;
        padding: 18px 24px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        margin-bottom: 16px;
      }

      /* ── Tag (section) headings ────────────────────────────────── */
      .swagger-ui .opblock-tag {
        font-size: 19px;
        font-weight: 700;
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding: 14px 0 10px;
        margin-top: 8px;
      }

      .swagger-ui .opblock-tag:hover { background: transparent; }

      .swagger-ui .opblock-tag small {
        font-size: 13px;
        font-weight: 400;
        color: #64748b;
        margin-left: 8px;
      }

      /* ── Operation blocks ──────────────────────────────────────── */
      .swagger-ui .opblock {
        border-radius: 10px;
        margin: 6px 0;
        border: 1.5px solid transparent;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        overflow: hidden;
        transition: box-shadow 0.2s;
      }

      .swagger-ui .opblock:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.1); }

      /* GET */
      .swagger-ui .opblock.opblock-get { background: #f0fdf4; border-color: #86efac; }
      .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #16a34a; }
      .swagger-ui .opblock.opblock-get .opblock-summary { border-color: #86efac; }

      /* POST */
      .swagger-ui .opblock.opblock-post { background: #eff6ff; border-color: #93c5fd; }
      .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #2563eb; }
      .swagger-ui .opblock.opblock-post .opblock-summary { border-color: #93c5fd; }

      /* PUT */
      .swagger-ui .opblock.opblock-put { background: #fffbeb; border-color: #fcd34d; }
      .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #d97706; }
      .swagger-ui .opblock.opblock-put .opblock-summary { border-color: #fcd34d; }

      /* PATCH */
      .swagger-ui .opblock.opblock-patch { background: #fdf4ff; border-color: #d8b4fe; }
      .swagger-ui .opblock.opblock-patch .opblock-summary-method { background: #9333ea; }
      .swagger-ui .opblock.opblock-patch .opblock-summary { border-color: #d8b4fe; }

      /* DELETE */
      .swagger-ui .opblock.opblock-delete { background: #fff1f2; border-color: #fca5a5; }
      .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #dc2626; }
      .swagger-ui .opblock.opblock-delete .opblock-summary { border-color: #fca5a5; }

      /* Method badge */
      .swagger-ui .opblock-summary-method {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        border-radius: 6px;
        min-width: 72px;
        padding: 6px 10px;
        text-align: center;
      }

      /* Path */
      .swagger-ui .opblock-summary-path,
      .swagger-ui .opblock-summary-path__deprecated {
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      /* Summary description */
      .swagger-ui .opblock-summary-description { color: #64748b; font-size: 13px; }

      /* Expanded body */
      .swagger-ui .opblock-body { background: #fff; }

      /* ── Buttons ────────────────────────────────────────────────── */
      .swagger-ui .btn {
        border-radius: 7px;
        font-weight: 500;
        font-size: 13px;
        transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      }

      .swagger-ui .btn.execute {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
        font-weight: 600;
        padding: 8px 22px;
      }

      .swagger-ui .btn.execute:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37,99,235,0.4);
      }

      .swagger-ui .btn.cancel { color: #ef4444; border-color: #ef4444; }
      .swagger-ui .btn.cancel:hover { background: #fff1f2; }

      .swagger-ui .try-out__btn { border-color: #2563eb; color: #2563eb; }
      .swagger-ui .try-out__btn:hover { background: #eff6ff; }

      /* ── Inputs ─────────────────────────────────────────────────── */
      .swagger-ui input[type=text],
      .swagger-ui input[type=password],
      .swagger-ui input[type=email],
      .swagger-ui input[type=search],
      .swagger-ui textarea,
      .swagger-ui select {
        border: 1.5px solid #cbd5e1;
        border-radius: 7px;
        padding: 7px 11px;
        font-size: 13px;
        color: #1e293b;
        background: #fff;
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .swagger-ui input[type=text]:focus,
      .swagger-ui input[type=password]:focus,
      .swagger-ui textarea:focus {
        border-color: #2563eb;
        outline: none;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
      }

      .swagger-ui .filter-container .operation-filter-input {
        border-radius: 8px;
        border: 1.5px solid #cbd5e1;
        font-size: 13px;
      }

      /* ── Response codes ─────────────────────────────────────────── */
      .swagger-ui .response-col_status { font-weight: 700; font-size: 15px; }

      .swagger-ui .responses-inner h4,
      .swagger-ui .responses-inner h5 { color: #0f172a; font-weight: 600; }

      .swagger-ui .microlight {
        background: #1e293b !important;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 12.5px;
        color: #e2e8f0;
        line-height: 1.6;
      }

      /* ── Models section ─────────────────────────────────────────── */
      .swagger-ui section.models {
        border-radius: 10px;
        border: 1.5px solid #e2e8f0;
        background: #fff;
        margin-top: 24px;
      }

      .swagger-ui section.models h4 {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding: 14px 20px;
        margin: 0;
      }

      .swagger-ui .model-box { border-radius: 6px; background: #f8fafc; }

      /* ── Layout ─────────────────────────────────────────────────── */
      .swagger-ui .wrapper { max-width: 1320px; }

      /* ── Table headers ──────────────────────────────────────────── */
      .swagger-ui table thead tr th,
      .swagger-ui table thead tr td {
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid #e2e8f0;
      }

      /* ── Auth modal ─────────────────────────────────────────────── */
      .swagger-ui .dialog-ux .modal-ux {
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      }

      .swagger-ui .dialog-ux .modal-ux-header {
        background: #0f172a;
        border-radius: 12px 12px 0 0;
        padding: 16px 24px;
      }

      .swagger-ui .dialog-ux .modal-ux-header h3 {
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }

      .swagger-ui .dialog-ux .modal-ux-header .close-modal svg { fill: #94a3b8; }
      .swagger-ui .dialog-ux .modal-ux-header .close-modal:hover svg { fill: #fff; }
      .swagger-ui .dialog-ux .modal-ux-content { padding: 20px 24px; }

      .swagger-ui .auth-container label {
        font-weight: 600;
        color: #0f172a;
        font-size: 13px;
      }

      /* ── Scrollbar ──────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
  </body>
</html>
